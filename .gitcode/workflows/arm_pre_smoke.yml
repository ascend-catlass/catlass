name: arm_pre_smoke

on:
  workflow_call:
    inputs:
      task_name:
        required: true
        type: string
      image_version:
        required: true
        type: string

jobs:
  # 原 pre_smoke_catlass job：保留 job 名，负责轻量的 self_contained + unittest。
  # 若 OBS 上的 pre_smoke.sh 尚不支持分组（旧脚本），由本 job 回退执行全量，其余分项 job 跳过。
  JOB_pre_smoke:
    name: pre_smoke_catlass
    steps:
      -
        name: Checkout
        identifier: process_checkout
        uses: checkout
        with:
          ref: ${{ atomgit.event.pull_request.merge_commit_sha || atomgit.sha }}
          allow-unsafe-pr-checkout: true
      -
        name: oidc_auth
        uses: huaweicloud-oidc-auth
        with:
          audience: ${{ secrets.audience }}
          agency_urn: ${{ secrets.agency_urn }}
          provider_urn: ${{ secrets.provider_urn }}
          region: cn-north-4
          duration: 3600
      -
        name: download
        uses: obs-download
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          key: |
            ${{ env.obs_path }}/pr_filelist.txt
            ${{ env.obs_path }}/pr_filelist_mod.txt
            ${{ env.obs_path }}/pre_smoke.sh
          path: ${{ steps.process_checkout.outputs.path }}
      -
        name: pre_smoke_catlass
        timeout-minutes: 30
        run: |
          set -e
          export WORKSPACE=${{ steps.process_checkout.outputs.path }}
          PRE_SMOKE="${WORKSPACE}/pre_smoke.sh"
          if grep -q 'CATLASS_TEST_GROUPS_V1' "${PRE_SMOKE}"; then
            sudo bash "${PRE_SMOKE}" "${WORKSPACE}" unittest
          else
            echo "[fallback] pre_smoke.sh does not support test groups; running full suite in this job"
            sudo bash "${PRE_SMOKE}" "${WORKSPACE}"
          fi

    if: "${{ default() }}"
    runs-on: ['self-hosted','npu=1','smoke=204']
    container:
      image: swr.cn-north-4.myhuaweicloud.com/hw-ascend/${{ inputs.image_version }}

