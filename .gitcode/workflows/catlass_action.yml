name: catlass_action

concurrency:
  max: 5
  exceed-action: QUEUE
  enable: true
  preemption:
    enable: true
    events: [mr_id]

on:
  pull_request_comment:
    types: [created]
    branches: [ '**' ]
    comments: [ '^(?:\/)?compile*' ]
  pr_comment:
      types: [ created ]
      keyword: '^(?:\/)?compile*'

env:
  org_name: ${{ vars.ORG_NAME }}
  repo_name: ${{ atomgit.event.repository.name }}
  MERGE_ID: ${{atomgit.event.pull_request.number}}
  TARGET_BRANCH: ${{atomgit.ref_name}}
  SOURCE_BRANCH: ${{atomgit.head_ref}}
  obs_path: "${{ env.org_name }}/${{ env.repo_name }}/ci/package/${{ env.MERGE_ID }}"
  obs_ut_path: "${{ env.obs_path }}/ut"
  obs_pre_smoke_path: "${{ env.obs_path }}/pre_smoke"

stages:
  stage1:
    name: PreBuild
    jobs:
      JOB_image:
        name: Test_image
        steps:
          - name: revise_image
            identifier: revise_image
            uses: cann/.gitcode/actions/revise-img@master
            with:
              repo_name: ${{ env.repo_name }}
              target_branch: ${{ env.TARGET_BRANCH }}
              comment: ${{ atomgit.event.comment.body }}
              token: ${{ secrets.TESTTOKEN }}
          -
            name: show_output
            run: |
              echo "image: ${{ steps.revise_image.outputs.Compile_Ascend_X86 }}"
        if: "${{ default() }}"
        runs-on: ["self-hosted", "arch=x64", "spec=small"]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu20.04.05_x86:k8s_v1.1006
      JOB_pre:
        name: Test_PreBuild
        uses: cann/.gitcode/.gitcode/workflows/pre_action.yml@master
    pre:
    - type: auto
    fail-fast: true
  stage2:
    name: compile
    jobs:
      JOB_codecheck_action:
        name: codecheck_action
        uses: .gitcode/workflows/codecheck_action.yml
        with:
          precommit_image_version: ${{ jobs.JOB_image.outputs.precommit }}
          codecheck_image_version: ${{ jobs.JOB_image.outputs.codecheck }}
      JOB_arm_compile:
        name: arm_compile
        uses: .gitcode/workflows/arm_compile_action.yml
        with:
          task_name: 'arm_compile'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_ARM }}
      JOB_arm_pre_smoke:
        name: arm_pre_smoke
        uses: .gitcode/workflows/arm_pre_smoke.yml
        with:
          task_name: 'arm_pre_smoke'
          image_version: ${{ jobs.JOB_image.outputs.PreSmoke }}
      JOB_UT_ir:
        name: UT_ir
        uses: .gitcode/workflows/x86_compile_action.yml
        with:
          ut_type: 'ir'
          task_name: 'UT_ir'
          image_version: ${{ jobs.JOB_image.outputs.UT_dsl }}
      JOB_UT_lit:
        name: UT_lit
        uses: .gitcode/workflows/x86_compile_action.yml
        with:
          ut_type: 'lit'
          task_name: 'UT_lit'
          image_version: ${{ jobs.JOB_image.outputs.UT_dsl }}
      JOB_staticcheck_markdown:
        name: staticcheck_markdown
        uses: .gitcode/workflows/staticcheck_action.yml
        with:
          check_type: 'markdown'
          image_version: ${{ jobs.JOB_image.outputs.staticcheck }}
      JOB_staticcheck_codespell_check:
        name: staticcheck_codespell_check
        uses: .gitcode/workflows/staticcheck_action.yml
        with:
          check_type: 'codespell_check'
          image_version: ${{ jobs.JOB_image.outputs.staticcheck }}
      JOB_staticcheck_tag_closed_check:
        name: staticcheck_tag_closed_check
        uses: .gitcode/workflows/staticcheck_action.yml
        with:
          check_type: 'tag_closed_check'
          image_version: ${{ jobs.JOB_image.outputs.staticcheck }}
      JOB_staticcheck_resource_existence_check:
        name: staticcheck_resource_existence_check
        uses: .gitcode/workflows/staticcheck_action.yml
        with:
          check_type: 'resource_existence_check'
          image_version: ${{ jobs.JOB_image.outputs.staticcheck }}
      JOB_staticcheck_link_validity_check:
        name: staticcheck_link_validity_check
        uses: .gitcode/workflows/staticcheck_action.yml
        with:
          check_type: 'link_validity_check'
          image_version: ${{ jobs.JOB_image.outputs.staticcheck }}
    pre:
    - type: auto
    fail-fast: true
post:
  jobs:
    job_post:
      name: Test_post
      uses: cann/.gitcode/.gitcode/workflows/post_action.yml@master