name: Run CATLASS CI tests
description: Activate the Ascend and Conda environments and run one CATLASS test stage

inputs:
  suite:
    description: Test suite to run (dsl or all)
    required: true
  worktree:
    description: Merged CATLASS worktree to test
    required: true

runs:
  using: composite
  steps:
    - name: Run test stage
      shell: bash
      env:
        CATLASS_TEST_SUITE: ${{ inputs.suite }}
        RDV_WORKTREE: ${{ inputs.worktree }}
      run: bash "${GITHUB_ACTION_PATH}/run-ci-tests.sh"
