name: Test a GitCode pull request

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number in cann/catlass on GitCode
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: test-gitcode-pr-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  merge-and-test:
    runs-on: [self-hosted, ascend950]
    timeout-minutes: 60
    steps:
      - name: Read pull request metadata from GitCode
        id: pr
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          set -euo pipefail

          if [[ ! "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "pr_number must be a positive integer" >&2
            exit 1
          fi

          api_url="https://api.gitcode.com/api/v5/repos/cann/catlass/pulls/${PR_NUMBER}"
          curl_args=(--fail --silent --show-error --location)
          if [[ -n "${GITCODE_TOKEN}" ]]; then
            curl_args+=(--header "PRIVATE-TOKEN: ${GITCODE_TOKEN}")
          fi
          pr_json="$(curl "${curl_args[@]}" "${api_url}")"

          state="$(jq -er '.state' <<<"${pr_json}")"
          base_ref="$(jq -er '.base.ref // .target_branch' <<<"${pr_json}")"
          base_sha="$(jq -er '.base.sha' <<<"${pr_json}")"
          head_ref="$(jq -er '.head.ref // .source_branch' <<<"${pr_json}")"
          head_sha="$(jq -er '.head.sha' <<<"${pr_json}")"

          if [[ "${state}" != "open" && "${state}" != "opened" ]]; then
            echo "PR #${PR_NUMBER} is not open (state: ${state})" >&2
            exit 1
          fi
          git check-ref-format --branch "${base_ref}" >/dev/null
          git check-ref-format --branch "${head_ref}" >/dev/null
          if [[ ! "${base_sha}" =~ ^[0-9a-f]{40}$ || ! "${head_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitCode returned an invalid base or head SHA" >&2
            exit 1
          fi

          {
            echo "base_ref=${base_ref}"
            echo "base_sha=${base_sha}"
            echo "head_ref=${head_ref}"
            echo "head_sha=${head_sha}"
          } >>"${GITHUB_OUTPUT}"

          echo "PR #${PR_NUMBER}: ${head_ref}@${head_sha} -> cann/catlass@${base_ref}"

      - name: Mark the pull request as running
        id: rdv_start
        uses: ascend-catlass/catlass/.github/actions/rdv-status@main
        with:
          phase: start
          pr-number: ${{ inputs.pr_number }}
          token: ${{ secrets.GITCODE_TOKEN }}
          result-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Merge the pull request into its target branch
        id: merge
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail

          rdv_temp_root="${RUNNER_TEMP}/catlass-rdv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          worktree="${rdv_temp_root}/worktree"
          git clone --quiet --no-tags --single-branch \
            --branch "${BASE_REF}" \
            https://gitcode.com/cann/catlass.git "${worktree}"

          fetched_base="$(git -C "${worktree}" rev-parse HEAD)"
          if [[ "${fetched_base}" != "${BASE_SHA}" ]]; then
            echo "PR target branch changed while this workflow was starting; run it again" >&2
            exit 1
          fi

          git -C "${worktree}" fetch --quiet --no-tags origin \
            "+refs/merge-requests/${PR_NUMBER}/head:refs/remotes/origin/pr-head"
          fetched_head="$(git -C "${worktree}" rev-parse refs/remotes/origin/pr-head)"
          if [[ "${fetched_head}" != "${HEAD_SHA}" ]]; then
            echo "PR head changed while this workflow was starting; run it again" >&2
            exit 1
          fi

          git -C "${worktree}" config user.name github-actions[bot]
          git -C "${worktree}" config user.email \
            41898282+github-actions[bot]@users.noreply.github.com
          git -C "${worktree}" merge --no-ff --no-commit "${HEAD_SHA}"

          run_dsl=false
          run_all=false
          while IFS= read -r -d '' changed_path; do
            case "${changed_path}" in
              docs/* | *.md | *.rst | *.png | *.jpg | *.jpeg | *.gif | *.svg | *.webp | *.bmp | *.ico)
                change_type=non-code
                ;;
              python/tla_dsl/*)
                change_type=dsl
                run_dsl=true
                ;;
              *)
                change_type=non-dsl
                run_all=true
                ;;
            esac
            printf '%s: %s\n' "${change_type}" "${changed_path}"
          done < <(git -C "${worktree}" diff --name-only -z "${BASE_SHA}...${HEAD_SHA}")

          {
            echo "worktree=${worktree}"
            echo "run_dsl=${run_dsl}"
            echo "run_all=${run_all}"
          } >>"${GITHUB_OUTPUT}"

      - name: Pass non-code-only changes
        if: ${{ steps.merge.outputs.run_dsl != 'true' && steps.merge.outputs.run_all != 'true' }}
        run: echo "Only documentation or image files changed; no tests are required."

      - name: Run DSL test stage
        if: ${{ steps.merge.outputs.run_dsl == 'true' }}
        uses: ascend-catlass/catlass/.github/actions/run-ci-tests@main
        with:
          suite: dsl
          worktree: ${{ steps.merge.outputs.worktree }}

      - name: Run non-DSL test stage
        if: ${{ !cancelled() && steps.merge.outputs.run_all == 'true' }}
        uses: ascend-catlass/catlass/.github/actions/run-ci-tests@main
        with:
          suite: all
          worktree: ${{ steps.merge.outputs.worktree }}

      - name: Report the result to GitCode
        if: ${{ always() && steps.pr.outcome == 'success' }}
        uses: ascend-catlass/catlass/.github/actions/rdv-status@main
        with:
          phase: finish
          pr-number: ${{ inputs.pr_number }}
          token: ${{ secrets.GITCODE_TOKEN }}
          result: ${{ job.status }}
          result-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          comment-id: ${{ steps.rdv_start.outputs.comment-id }}
