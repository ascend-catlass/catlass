name: Test a GitCode pull request

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number in cann/catlass on GitCode
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: test-gitcode-pr-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  merge-and-test:
    runs-on: [self-hosted, ascend950]
    timeout-minutes: 60
    steps:
      - name: Read pull request metadata from GitCode
        id: pr
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          set -euo pipefail

          if [[ ! "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "pr_number must be a positive integer" >&2
            exit 1
          fi

          api_url="https://api.gitcode.com/api/v5/repos/cann/catlass/pulls/${PR_NUMBER}"
          curl_args=(--fail --silent --show-error --location)
          if [[ -n "${GITCODE_TOKEN}" ]]; then
            curl_args+=(--header "PRIVATE-TOKEN: ${GITCODE_TOKEN}")
          fi
          pr_json="$(curl "${curl_args[@]}" "${api_url}")"

          state="$(jq -er '.state' <<<"${pr_json}")"
          base_ref="$(jq -er '.base.ref // .target_branch' <<<"${pr_json}")"
          head_ref="$(jq -er '.head.ref // .source_branch' <<<"${pr_json}")"
          head_sha="$(jq -er '.head.sha' <<<"${pr_json}")"
          head_repo_url="$(jq -er '.head.repo.html_url' <<<"${pr_json}")"

          if [[ "${state}" != "open" && "${state}" != "opened" ]]; then
            echo "PR #${PR_NUMBER} is not open (state: ${state})" >&2
            exit 1
          fi
          git check-ref-format --branch "${base_ref}" >/dev/null
          git check-ref-format --branch "${head_ref}" >/dev/null
          if [[ ! "${head_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitCode returned an invalid head SHA" >&2
            exit 1
          fi
          if [[ ! "${head_repo_url}" =~ ^https://gitcode\.com/[^[:space:]]+\.git$ ]]; then
            echo "GitCode returned an unexpected source repository URL" >&2
            exit 1
          fi

          {
            echo "base_ref=${base_ref}"
            echo "head_ref=${head_ref}"
            echo "head_sha=${head_sha}"
            echo "head_repo_url=${head_repo_url}"
          } >>"${GITHUB_OUTPUT}"

          echo "PR #${PR_NUMBER}: ${head_repo_url}@${head_ref} -> cann/catlass@${base_ref}"

      - name: Mark the pull request as running
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${GITCODE_TOKEN}" ]]; then
            echo "GITCODE_TOKEN is required to update pull request labels" >&2
            exit 1
          fi

          labels_url="https://api.gitcode.com/api/v5/repos/cann/catlass/pulls/${PR_NUMBER}/labels"
          gitcode_api() {
            local method="$1"
            local url="$2"
            shift 2
            curl --fail --silent --show-error --location \
              --request "${method}" \
              --header "PRIVATE-TOKEN: ${GITCODE_TOKEN}" \
              "${url}" "$@"
          }

          current_labels="$(gitcode_api GET "${labels_url}")"
          for label in RDV-SUCC RDV-RUNNING RDV-FAIL; do
            if jq -e --arg label "${label}" \
              'any(.[]; .name == $label)' <<<"${current_labels}" >/dev/null; then
              gitcode_api DELETE "${labels_url}/${label}" >/dev/null
            fi
          done

          gitcode_api POST "${labels_url}" \
            --header "Content-Type: application/json" \
            --data '["RDV-RUNNING"]' >/dev/null

      - name: Merge the pull request into its target branch
        id: merge
        shell: bash
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          HEAD_REPO_URL: ${{ steps.pr.outputs.head_repo_url }}
        run: |
          set -euo pipefail

          init_worktree() {
            local worktree="$1"
            mkdir -p "${worktree}"
            git -C "${worktree}" init --quiet
            git -C "${worktree}" remote add gitcode \
              https://gitcode.com/cann/catlass.git
            git -C "${worktree}" remote add gitcode-pr "${HEAD_REPO_URL}"
          }

          rdv_temp_root="${RUNNER_TEMP}/catlass-rdv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          shallow_worktree="${rdv_temp_root}/shallow"
          init_worktree "${shallow_worktree}"

          fetch_depth=32
          git -C "${shallow_worktree}" fetch --no-tags --depth="${fetch_depth}" \
            gitcode "+refs/heads/${BASE_REF}:refs/remotes/gitcode/target"
          git -C "${shallow_worktree}" fetch --no-tags --depth="${fetch_depth}" \
            gitcode-pr "+refs/heads/${HEAD_REF}:refs/remotes/gitcode-pr/head"

          for _ in 1 2 3 4 5 6; do
            if git -C "${shallow_worktree}" merge-base \
              refs/remotes/gitcode/target refs/remotes/gitcode-pr/head >/dev/null; then
              break
            fi
            git -C "${shallow_worktree}" fetch --no-tags --deepen="${fetch_depth}" \
              gitcode "+refs/heads/${BASE_REF}:refs/remotes/gitcode/target"
            git -C "${shallow_worktree}" fetch --no-tags --deepen="${fetch_depth}" \
              gitcode-pr "+refs/heads/${HEAD_REF}:refs/remotes/gitcode-pr/head"
            fetch_depth=$((fetch_depth * 2))
          done

          if git -C "${shallow_worktree}" merge-base \
            refs/remotes/gitcode/target refs/remotes/gitcode-pr/head >/dev/null; then
            worktree="${shallow_worktree}"
          else
            echo "Shallow history does not contain the merge base; fetching only the two required branches with full history."
            worktree="${rdv_temp_root}/full"
            init_worktree "${worktree}"
            git -C "${worktree}" fetch --no-tags gitcode \
              "+refs/heads/${BASE_REF}:refs/remotes/gitcode/target"
            git -C "${worktree}" fetch --no-tags gitcode-pr \
              "+refs/heads/${HEAD_REF}:refs/remotes/gitcode-pr/head"
          fi

          fetched_head="$(git -C "${worktree}" rev-parse refs/remotes/gitcode-pr/head)"
          if [[ "${fetched_head}" != "${HEAD_SHA}" ]]; then
            echo "PR head changed while this workflow was starting; run it again" >&2
            exit 1
          fi

          git -C "${worktree}" config user.name github-actions[bot]
          git -C "${worktree}" config user.email \
            41898282+github-actions[bot]@users.noreply.github.com
          git -C "${worktree}" switch --detach refs/remotes/gitcode/target
          git -C "${worktree}" merge --no-ff --no-commit "${HEAD_SHA}"
          echo "worktree=${worktree}" >>"${GITHUB_OUTPUT}"

      - name: Build CATLASS examples for Ascend 3510
        shell: bash
        env:
          RDV_WORKTREE: ${{ steps.merge.outputs.worktree }}
        run: |
          set -eo pipefail

          if [[ -f /workspace/Ascend/cann/set_env.sh ]]; then
            cann_env=/workspace/Ascend/cann/set_env.sh
          elif [[ -f /usr/local/Ascend/cann/set_env.sh ]]; then
            cann_env=/usr/local/Ascend/cann/set_env.sh
          else
            echo "CANN environment script was not found in either fallback path" >&2
            exit 1
          fi

          echo "Activating CANN environment from ${cann_env}"
          # shellcheck source=/dev/null
          source "${cann_env}"
          cd "${RDV_WORKTREE}/scripts"
          bash build.sh catlass_examples -DCATLASS_ARCH=3510

      - name: Report the result to GitCode
        if: ${{ always() && steps.pr.outcome == 'success' }}
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          if [[ -z "${GITCODE_TOKEN}" ]]; then
            echo "GITCODE_TOKEN is required to update pull request labels" >&2
            exit 1
          fi
          if [[ "${JOB_STATUS}" == "success" ]]; then
            result_label="RDV-SUCC"
          else
            result_label="RDV-FAIL"
          fi

          labels_url="https://api.gitcode.com/api/v5/repos/cann/catlass/pulls/${PR_NUMBER}/labels"
          comments_url="https://api.gitcode.com/api/v5/repos/cann/catlass/pulls/${PR_NUMBER}/comments"
          gitcode_api() {
            local method="$1"
            local url="$2"
            shift 2
            curl --fail --silent --show-error --location \
              --request "${method}" \
              --header "PRIVATE-TOKEN: ${GITCODE_TOKEN}" \
              "${url}" "$@"
          }

          current_labels="$(gitcode_api GET "${labels_url}")"
          if jq -e 'any(.[]; .name == "RDV-RUNNING")' \
            <<<"${current_labels}" >/dev/null; then
            gitcode_api DELETE "${labels_url}/RDV-RUNNING" >/dev/null
          fi

          gitcode_api POST "${labels_url}" \
            --header "Content-Type: application/json" \
            --data "[\"${result_label}\"]" >/dev/null

          result_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          comment_body="${result_label}: [查看 RDV 运行结果](${result_url})"
          comment_json="$(jq -cn --arg body "${comment_body}" '{body: $body}')"
          gitcode_api POST "${comments_url}" \
            --header "Content-Type: application/json" \
            --data "${comment_json}" >/dev/null
          echo "Set PR #${PR_NUMBER} label to ${result_label}"
