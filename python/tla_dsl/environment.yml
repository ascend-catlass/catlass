# Conda environment for Ascend CATLASS Python.
# LLVM/MLIR are provided by the AscendNPU-IR build, not by conda.
name: ascend-catlass-dsl
channels:
  - defaults
  - conda-forge
dependencies:
  - python>=3.10,<3.14
  - cmake>=3.28,<4.0
  - ninja>=1.12
  - clang=19.1.7
  - clangxx=19.1.7
  - clang-tools=19.1.7
  - lld=19.1.7
  - lit=19.1.7
  - pip:
      # build
      - setuptools>=68
      - wheel
      - setuptools-scm>=8
      - pybind11==2.13.6
      # runtime
      - numpy>=1.24,<3
      - attrs
      - cython
      - decorator
      - sympy
      - cffi
      - pyyaml
      - pathlib2
      - psutil
      - protobuf==3.20.0
      - scipy
      - requests
      - absl-py
      # dev/test
      - pytest
      - pytest-xdist
      - ruff
      - black
      - mypy
      # docs
      - mkdocs>=1.6.1
