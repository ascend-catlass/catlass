[build-system]
requires = [
  "setuptools>=68",
  "wheel",
  "cmake>=3.28,<4.0",
  "ninja>=1.12",
  "pybind11==2.13.6",
  "setuptools-scm>=8"
]
build-backend = "setuptools.build_meta"

[project]
name = "ascend-catlass-dsl"
description = "Ascend CATLASS Python (Tla IR / Python catlass), nested under the CATLASS repository."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license-files = ["LICENSE", "LICENSE-APACHE"]
authors = [
  { name = "Ascend CATLASS Python Contributors" }
]
dependencies = [
  "numpy>=1.24,<3",
]
dynamic = ["version"]

[project.optional-dependencies]
docs = [
  "mkdocs>=1.6.1",
  "mkdocs-material",
  "mkdocs-static-i18n>=1.3.1,<2"
]

# PEP 735 dependency groups. Install with:
#   pip install --group cann       # CANN Python deps (base for on-board runtime)
#   pip install --group runtime    # cann + project runtime deps
#   pip install --group dev        # runtime + dev/test tooling
# `--group` installs the listed deps WITHOUT installing the current package.
[dependency-groups]
# CANN Python base deps (standalone, unrelated to project runtime).
cann = [
  "attrs",
  "cython",
  "decorator",
  "sympy",
  "cffi",
  "pyyaml",
  "pathlib2",
  "psutil",
  "protobuf==3.20.0",
  "scipy",
  "requests",
  "absl-py",
]
# Runtime: project runtime deps only.
runtime = [
  "numpy>=1.24,<3",
]
# Dev: runtime + dev/test tooling.
dev = [
  {include-group = "runtime"},
  "pytest",
  "pytest-xdist",
  "lit==18.1.8",
  "ruff",
  "black",
  "mypy",
]

[tool.setuptools.packages.find]
include = ["catlass*"]

[tool.setuptools.package-data]
"catlass" = ["csrc/mlir/bc/**/*.cpp", "csrc/mlir/bc/**/*.h", "include/**/*.hpp"]

[tool.setuptools_scm]
write_to = "catlass/_version.py"
fallback_version = "0.0.0"
search_parent_directories = true
tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"
git_describe_command = "git describe --dirty --tags --long --match v[0-9]* --exclude v*[a-zA-Z]*"

[tool.ruff]
target-version = "py310"

[tool.ruff.format]
exclude = ["catlass/_version.py"]

[tool.ruff.lint.per-file-ignores]
"catlass/base_dsl/__init__.py" = ["F403"]
# Pre-commit CI: suppress non-format lint (E402 after path bootstrap, re-export F401/F822,
# latent F821, intentional unused DSL locals F841). Format is handled by ruff-format.
"catlass/core_api.py" = ["E402", "F401", "F822"]
"catlass/dsl.py" = ["E402"]
"catlass/execution.py" = ["E402", "F401"]
"catlass/runtime.py" = ["F401", "F822"]
"catlass/types.py" = ["E402", "F822"]
"catlass/tla/__init__.py" = ["F401"]
"tests/lit/lit.cfg.py" = ["F821"]
"tests/frontend/test_kernel_class_organization.py" = ["F821"]
"tests/test_execution_lowering.py" = ["F841"]
"tests/test_generated_ops_surface.py" = ["F841"]
"tests/test_frontend_lowering.py" = ["F722", "F821"]
